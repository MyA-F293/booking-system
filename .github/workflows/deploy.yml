name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build production
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_FEEDBACK_SHEET_URL: ${{ secrets.VITE_FEEDBACK_SHEET_URL }}
        VITE_ATTENDANCE_SHEET_URL: ${{ secrets.VITE_ATTENDANCE_SHEET_URL }}
        VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        VITE_APP_URL: https://portal.eysalanguagecenter.com
    
    - name: Copy .htaccess to dist
      run: cp .htaccess dist/
    
    - name: Deploy to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: eysalanguagecenter.com
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: /public_html/portal.eysalanguagecenter.com/
        dangerous-clean-slate: true
        timeout: 300000
        log-level: verbose
