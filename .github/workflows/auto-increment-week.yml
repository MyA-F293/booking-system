name: Auto Increment Week

# Otomatis increment current_week setiap Senin jam 00:01 WIB
# Senin 00:01 WIB = Minggu 17:01 UTC

on:
  schedule:
    # Setiap Minggu jam 17:01 UTC (= Senin 00:01 WIB)
    # Cron format: minute hour day-of-month month day-of-week
    # 0 = Sunday, 1 = Monday, dst.
    - cron: '1 17 * * 0'
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  increment-week:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Call Supabase RPC to increment week
        run: |
          echo "🚀 Calling Supabase API to increment week..."
          
          # Call API once and save response
          response=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d "{\"api_key\": \"${{ secrets.SUPABASE_API_KEY }}\"}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/api_increment_week")
          
          echo "📊 Response: $response"
          
          # Parse JSON using jq (more reliable than grep)
          success=$(echo "$response" | jq -r '.success // false')
          
          if [ "$success" = "true" ]; then
            old_week=$(echo "$response" | jq -r '.old_week')
            new_week=$(echo "$response" | jq -r '.new_week')
            
            echo "✅ Week incremented successfully!"
            echo "📅 Week changed from $old_week to $new_week"
          else
            error=$(echo "$response" | jq -r '.error // "Unknown error"')
            echo "❌ Failed to increment week: $error"
            echo "Response: $response"
            exit 1
          fi
      
      - name: Send notification (optional)
        if: success()
        run: |
          echo "✅ Auto-increment week completed successfully at $(date)"
          # Tambahkan notifikasi ke Slack/Discord/Email jika perlu
